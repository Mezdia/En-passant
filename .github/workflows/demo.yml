name: Demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build demo and publish to demo-build branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo bundle
        run: pnpm build:demo

      - name: Upload demo artifact (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: dist-demo
          if-no-files-found: error
          retention-days: 7

      - name: Publish to demo-build branch
        run: bash .github/scripts/publish-demo.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}