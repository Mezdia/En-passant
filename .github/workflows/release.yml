name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Desktop bundles for Windows, macOS and Linux. Skipped for `*-android`
  # tags, where only the Android preview job should run.
  release:
    if: ${{ !endsWith(github.ref_name, '-android') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only install macos targets on macos runners
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          CI: false
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Android is built separately because `tauri-action` only drives the desktop
  # bundler. The APK/AAB are attached to a dedicated pre-release tagged
  # `<release tag>-android` (e.g. `v0.15.0-android`) so the desktop release
  # stays stable while the mobile build ships as a preview.
  android:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }} ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Point the build at the NDK and the build tools
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      # `src-tauri/gen/` is not checked in, so the Gradle project is generated
      # from `tauri.conf.json` on every run.
      - name: Generate the Android project
        run: pnpm tauri android init --ci --skip-targets-install

      # The generated project ships Tauri's placeholder launcher icons, and
      # `src-tauri/icons/android/` is not read by the build, so the branded
      # mipmaps are copied over the generated resources.
      - name: Apply the branded launcher icons
        run: cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Build the Android app
        run: pnpm tauri android build --apk --aab
        env:
          CI: false

      # Gradle emits unsigned release artifacts; they are aligned and signed
      # here so no secret has to be written into the generated Gradle files.
      - name: Sign and stage the Android artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/sign-android.sh

      - name: Upload the Android artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-artifacts/*
          if-no-files-found: error

      # On a plain `vX.Y.Z` tag the Android preview is published under
      # `vX.Y.Z-android`; on a `vX.Y.Z-android` tag it (re)attaches to that
      # same pre-release.
      - name: Resolve the Android release tag
        id: android-release
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *-android ]]; then
            echo "tag=${{ github.ref_name }}"
          else
            echo "tag=${{ github.ref_name }}-android"
          fi >> "$GITHUB_OUTPUT"

      - name: Create the Android pre-release (if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.android-release.outputs.tag }}"
          version="$(jq -r .version package.json)"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Pre-release $tag already exists"
          else
            notes=$'Preview of the Android app.\n\n- APK: installable on Android 7+ (minSdk 24)\n- AAB: upload to the Play Console\n\nDesktop builds for Windows, macOS and Linux live in the stable release.'
            gh release create "$tag" \
              --prerelease \
              --title "EnPassant Android v${version} (preview)" \
              --notes "$notes"
          fi

      - name: Attach the Android artifacts to the pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.android-release.outputs.tag }}" android-artifacts/* --clobber